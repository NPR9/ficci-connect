<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect — FICCI Frames 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0A0A;
    --gold: #B8913F;
    --gold-light: #D4AA5E;
    --gold-dim: #7A5F28;
    --white: #F5F2EC;
    --grey: #2A2A2A;
    --grey-mid: #444;
    --text-dim: #888;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  /* ── SCREENS ── */
  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ── CHOOSE PERSON SCREEN ── */
  #screen-person {
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    gap: 48px;
  }

  .event-tag {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    text-transform: uppercase;
  }

  .person-header {
    text-align: center;
  }

  .person-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 8vw, 48px);
    font-weight: 300;
    line-height: 1.1;
    color: var(--white);
    margin-bottom: 12px;
  }

  .person-header p {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 300;
    line-height: 1.6;
    max-width: 280px;
    margin: 0 auto;
  }

  .person-cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 360px;
  }

  .person-card {
    background: var(--grey);
    border: 1px solid #333;
    padding: 24px 28px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .person-card::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--gold);
    transform: scaleY(0);
    transition: transform 0.2s;
    transform-origin: bottom;
  }

  .person-card:hover, .person-card:focus {
    border-color: var(--gold-dim);
    background: #1E1E1E;
    outline: none;
  }

  .person-card:hover::after, .person-card:focus::after {
    transform: scaleY(1);
  }

  .person-card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--white);
    margin-bottom: 4px;
  }

  .person-card-role {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  /* ── COMPANY SCREEN ── */
  #screen-company {
    padding: 0;
  }

  .company-hero {
    padding: 48px 28px 36px;
    border-bottom: 1px solid #1E1E1E;
  }

  .back-btn {
    background: rgba(184,145,63,0.08);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    padding: 8px 14px;
    margin-bottom: 28px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.08em;
    transition: background 0.15s, border-color 0.15s;
  }

  .back-btn:hover, .back-btn:focus {
    background: rgba(184,145,63,0.15);
    border-color: var(--gold);
    outline: none;
  }

  .back-arrow {
    display: inline-block;
    transform: rotate(180deg);
    font-size: 14px;
  }

  .hero-greeting {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .hero-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 300;
    line-height: 1.1;
    color: var(--white);
    margin-bottom: 4px;
  }

  .hero-name span {
    color: var(--gold);
  }

  .hero-sub {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 300;
    margin-top: 10px;
  }

  .company-list {
    padding: 28px 20px 48px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .company-tile {
    background: var(--grey);
    border: 1px solid #2E2E2E;
    padding: 22px 24px;
    cursor: pointer;
    transition: border-color 0.18s, background 0.18s;
    display: flex;
    align-items: flex-start;
    gap: 18px;
    text-align: left;
    width: 100%;
    font-family: inherit;
    color: inherit;
    position: relative;
  }

  .company-tile:hover, .company-tile:focus {
    border-color: var(--gold);
    background: #181818;
    outline: none;
  }

  .tile-icon {
    width: 36px;
    height: 36px;
    border: 1px solid var(--gold-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .tile-icon svg {
    width: 16px;
    height: 16px;
    stroke: var(--gold);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tile-body { flex: 1; }

  .tile-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--white);
    margin-bottom: 5px;
    line-height: 1.1;
  }

  .tile-desc {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 300;
    line-height: 1.6;
    max-width: 260px;
  }

  .tile-arrow {
    color: var(--gold-dim);
    font-size: 16px;
    align-self: center;
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }

  .company-tile:hover .tile-arrow {
    color: var(--gold);
    transform: translateX(3px);
  }

  /* ── CONFIRM SCREEN ── */
  #screen-confirm {
    align-items: center;
    justify-content: center;
    padding: 48px 28px;
    gap: 0;
    text-align: center;
  }

  .confirm-icon {
    width: 64px;
    height: 64px;
    border: 1px solid var(--gold-dim);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 32px;
  }

  .confirm-icon svg {
    width: 24px;
    height: 24px;
    stroke: var(--gold);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .confirm-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .confirm-headline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 300;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 14px;
  }

  .confirm-body {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
    max-width: 280px;
    margin: 0 auto 36px;
  }

  .confirm-company-tag {
    display: inline-block;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 12px;
    margin-bottom: 36px;
  }

  .btn-primary {
    display: block;
    width: 100%;
    max-width: 300px;
    background: var(--gold);
    color: var(--black);
    border: none;
    padding: 16px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
    text-align: center;
    margin: 0 auto;
  }

  .btn-primary:hover { background: var(--gold-light); }

  .btn-secondary {
    background: none;
    border: 1px solid #333;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
    margin-top: 14px;
    padding: 12px 20px;
    display: block;
    width: 100%;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    letter-spacing: 0.06em;
    transition: border-color 0.15s, color 0.15s;
  }

  .btn-secondary:hover, .btn-secondary:focus {
    border-color: var(--gold-dim);
    color: var(--gold);
    outline: none;
  }

  /* ── ADMIN SCREEN ── */
  #screen-admin {
    padding: 0;
    min-height: 100vh;
  }

  .admin-header {
    padding: 36px 24px 24px;
    border-bottom: 1px solid #1E1E1E;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .admin-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    color: var(--white);
    margin-bottom: 4px;
  }

  .admin-sub {
    font-size: 12px;
    color: var(--text-dim);
  }

  .btn-export {
    background: none;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.08em;
    padding: 10px 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    white-space: nowrap;
  }

  .btn-export:hover {
    border-color: var(--gold);
    background: rgba(184,145,63,0.08);
  }

  .admin-filters {
    padding: 16px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid #1A1A1A;
  }

  .filter-btn {
    background: none;
    border: 1px solid #333;
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }

  .filter-btn.active {
    border-color: var(--gold-dim);
    color: var(--gold);
    background: rgba(184,145,63,0.06);
  }

  .log-list {
    padding: 16px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .log-entry {
    background: var(--grey);
    border: 1px solid #252525;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 16px;
    align-items: start;
  }

  .log-name-row {
    display: flex;
    align-items: center;
    gap: 10px;
    grid-column: 1;
  }

  .log-contact-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 400;
    color: var(--white);
  }

  .log-company-badge {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid;
    flex-shrink: 0;
  }

  .badge-goldfinch { border-color: #B8913F44; color: var(--gold); }
  .badge-squad { border-color: #5E8A6E44; color: #7AAE8A; }
  .badge-engen3 { border-color: #6E5E9A44; color: #9A7ABE; }

  .log-meta {
    font-size: 11px;
    color: var(--text-dim);
    grid-column: 1;
  }

  .log-time {
    font-size: 11px;
    color: var(--text-dim);
    grid-column: 2;
    grid-row: 1 / 3;
    align-self: center;
    text-align: right;
    white-space: nowrap;
  }

  .log-name-input {
    background: none;
    border: none;
    border-bottom: 1px solid #333;
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    padding: 2px 4px;
    width: 140px;
    outline: none;
    transition: border-color 0.15s;
  }

  .log-name-input:focus { border-color: var(--gold-dim); }
  .log-name-input::placeholder { color: #555; font-style: italic; }

  .log-save-btn {
    background: none;
    border: none;
    color: var(--gold-dim);
    font-size: 11px;
    cursor: pointer;
    padding: 2px 6px;
    font-family: 'DM Sans', sans-serif;
    transition: color 0.15s;
    margin-left: 6px;
  }

  .log-save-btn:hover { color: var(--gold); }

  .empty-state {
    text-align: center;
    padding: 64px 24px;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.8;
  }

  .empty-icon {
    font-size: 32px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  /* ── ADMIN ENTRY POINT ── */
  .admin-trigger {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #111;
    border: 1px solid #222;
    color: #333;
    font-size: 10px;
    padding: 8px 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.1em;
    transition: color 0.2s, border-color 0.2s;
    z-index: 100;
  }

  .admin-trigger:hover { color: var(--gold-dim); border-color: #333; }

  /* ── LOADING ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: var(--gold-dim);
    font-size: 12px;
    letter-spacing: 0.1em;
  }

  /* ── DIVIDER ── */
  .gold-line {
    width: 32px;
    height: 1px;
    background: var(--gold-dim);
    margin: 0 auto;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>

<div id="app" class="loading">Loading…</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const CONFIG = {
  event: "FICCI Frames 2026",
  people: {
    phil: {
      id: "phil",
      name: "Phil McKenzie",
      role: "Principal, Goldfinch",
      wa: "447535436122",
      greeting: "Good to connect at FICCI Frames. Let's find where our worlds overlap."
    },
    niraj: {
      id: "niraj",
      name: "Niraj Puran Rao",
      role: "AI Systems Architect",
      wa: "919545050618",
      greeting: "Good to meet you at FICCI Frames. Here to explore what we can build together."
    }
  },
  companies: [
    {
      id: "goldfinch",
      name: "Goldfinch",
      desc: "Academy Award & BAFTA-winning entertainment finance, production & venture studio",
      icon: "film",
      badgeClass: "badge-goldfinch"
    },
    {
      id: "squad",
      name: "Squad",
      desc: "AI-powered film production studio",
      icon: "cpu",
      badgeClass: "badge-squad"
    },
    {
      id: "engen3",
      name: "enGEN3",
      desc: "The operating system for participatory IP — create, produce, distribute & earn with your audience",
      icon: "globe",
      badgeClass: "badge-engen3"
    }
  ]
};

// ── STATE ──────────────────────────────────────────────────
let state = {
  screen: "person",   // person | company | confirm | admin
  person: null,
  company: null,
  db: null,
  logs: [],
  filterPerson: "all",
  filterCompany: "all"
};

// ── DB ──────────────────────────────────────────────────────
async function initDB() {
  try {
    state.db = await claude.use("db");
  } catch(e) {
    state.db = null;
  }
}

async function logClick(personId, companyId) {
  if (!state.db) return;
  const id = `log_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
  try {
    await state.db.doc(`contacts/${id}`).set({
      id,
      personId,
      companyId,
      contactName: "",
      ts: Date.now()
    });
  } catch(e) { /* silent */ }
}

async function loadLogs() {
  if (!state.db) return [];
  try {
    const snap = await state.db.collection("contacts").orderBy("ts", "desc").limit(200).get();
    return snap.docs.map(d => d.data());
  } catch(e) { return []; }
}

async function updateContactName(logId, name) {
  if (!state.db) return;
  try {
    await state.db.doc(`contacts/${logId}`).update({ contactName: name });
  } catch(e) { /* silent */ }
}

// ── ICONS ──────────────────────────────────────────────────
const ICONS = {
  film: `<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="2" y1="17" x2="7" y2="17"/></svg>`,
  cpu: `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>`,
  globe: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
  check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
  back: `›`
};

// ── WA LINK ────────────────────────────────────────────────
function buildWALink(person, company) {
  const msg = encodeURIComponent(
    `Hi ${person.name} — ${company.name} caught my attention. Good meeting you at ${CONFIG.event}.`
  );
  return `https://wa.me/${person.wa}?text=${msg}`;
}

// ── RENDER ─────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  app.className = "";
  app.innerHTML = "";

  if (state.screen === "person") renderPerson(app);
  else if (state.screen === "company") renderCompany(app);
  else if (state.screen === "confirm") renderConfirm(app);
  else if (state.screen === "admin") renderAdmin(app);

  // admin trigger (hidden)
  if (state.screen !== "admin") {
    const trigger = document.createElement("button");
    trigger.className = "admin-trigger";
    trigger.textContent = "···";
    trigger.title = "Admin";
    let tapCount = 0;
    trigger.addEventListener("click", () => {
      tapCount++;
      if (tapCount >= 3) { state.screen = "admin"; render(); }
      setTimeout(() => { tapCount = 0; }, 1200);
    });
    app.appendChild(trigger);
  }
}

function renderPerson(app) {
  const screen = document.createElement("div");
  screen.className = "screen active";
  screen.id = "screen-person";

  screen.innerHTML = `
    <div class="event-tag">${CONFIG.event}</div>
    <div class="person-header">
      <h1>Who are you<br>meeting with?</h1>
      <p>Select the person you just spoke with to connect via WhatsApp.</p>
    </div>
    <div class="gold-line"></div>
    <div class="person-cards">
      ${Object.values(CONFIG.people).map(p => `
        <button class="person-card" data-person="${p.id}" aria-label="Connect with ${p.name}">
          <div class="person-card-name">${p.name}</div>
          <div class="person-card-role">${p.role}</div>
        </button>
      `).join("")}
    </div>
  `;

  screen.querySelectorAll(".person-card").forEach(btn => {
    btn.addEventListener("click", () => {
      state.person = CONFIG.people[btn.dataset.person];
      state.screen = "company";
      render();
    });
  });

  app.appendChild(screen);
}

function renderCompany(app) {
  const screen = document.createElement("div");
  screen.className = "screen active";
  screen.id = "screen-company";
  screen.style.minHeight = "100vh";

  const p = state.person;

  screen.innerHTML = `
    <div class="company-hero">
      <button class="back-btn" id="back-btn">
        <span class="back-arrow">›</span> Choose different person
      </button>
      <div class="hero-greeting">Connecting with</div>
      <div class="hero-name"><span>${p.name.split(" ")[0]}</span></div>
      <div class="hero-sub">What brought you together?</div>
    </div>
    <div class="company-list">
      ${CONFIG.companies.map(c => `
        <button class="company-tile" data-company="${c.id}" aria-label="${c.name}">
          <div class="tile-icon">${ICONS[c.icon]}</div>
          <div class="tile-body">
            <div class="tile-name">${c.name}</div>
            <div class="tile-desc">${c.desc}</div>
          </div>
          <div class="tile-arrow">›</div>
        </button>
      `).join("")}
    </div>
  `;

  screen.querySelector("#back-btn").addEventListener("click", () => {
    state.screen = "person";
    render();
  });

  screen.querySelectorAll(".company-tile").forEach(btn => {
    btn.addEventListener("click", () => {
      const company = CONFIG.companies.find(c => c.id === btn.dataset.company);
      state.company = company;
      logClick(state.person.id, company.id);
      state.screen = "confirm";
      render();
    });
  });

  app.appendChild(screen);
}

function renderConfirm(app) {
  const screen = document.createElement("div");
  screen.className = "screen active";
  screen.id = "screen-confirm";

  const p = state.person;
  const c = state.company;
  const waLink = buildWALink(p, c);

  screen.innerHTML = `
    <div class="confirm-icon">${ICONS.check}</div>
    <div class="confirm-label">${CONFIG.event}</div>
    <div class="confirm-headline">One tap to<br>connect on WhatsApp</div>
    <div class="confirm-company-tag">${c.name}</div>
    <div class="confirm-body">
      Opens WhatsApp with a pre-written note to ${p.name.split(" ")[0]}. Hit send — and you're connected.
    </div>
    <a href="${waLink}" class="btn-primary" target="_blank" rel="noopener">
      Open WhatsApp →
    </a>
    <button class="btn-secondary" id="back-to-companies">← Wrong company? Go back</button>
  `;

  screen.querySelector("#back-to-companies").addEventListener("click", () => {
    state.screen = "company";
    render();
  });

  app.appendChild(screen);
}

// ── ADMIN ──────────────────────────────────────────────────
async function renderAdmin(app) {
  const screen = document.createElement("div");
  screen.className = "screen active";
  screen.id = "screen-admin";

  state.logs = await loadLogs();

  screen.innerHTML = `
    <div class="admin-header">
      <div>
        <div class="admin-title">Contact Log</div>
        <div class="admin-sub">${CONFIG.event} · ${state.logs.length} interactions</div>
      </div>
      <button class="btn-export" id="export-btn">Export PDF</button>
    </div>
    <div class="admin-filters">
      <button class="filter-btn ${state.filterPerson==='all'?'active':''}" data-filter-person="all">All</button>
      ${Object.values(CONFIG.people).map(p=>`
        <button class="filter-btn ${state.filterPerson===p.id?'active':''}" data-filter-person="${p.id}">${p.name.split(" ")[0]}</button>
      `).join("")}
      <button class="filter-btn ${state.filterCompany==='all'?'active':''}" data-filter-company="all">All companies</button>
      ${CONFIG.companies.map(c=>`
        <button class="filter-btn ${state.filterCompany===c.id?'active':''}" data-filter-company="${c.id}">${c.name}</button>
      `).join("")}
    </div>
    <div class="log-list" id="log-list"></div>
    <button class="back-btn" id="admin-back" style="padding:16px 24px;display:block;color:#555;background:none;border:none;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;letter-spacing:0.05em;">← Back to main</button>
  `;

  // filters
  screen.querySelectorAll("[data-filter-person]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.filterPerson = btn.dataset.filterPerson;
      renderLogList(screen.querySelector("#log-list"));
      screen.querySelectorAll("[data-filter-person]").forEach(b => b.classList.toggle("active", b.dataset.filterPerson === state.filterPerson));
    });
  });

  screen.querySelectorAll("[data-filter-company]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.filterCompany = btn.dataset.filterCompany;
      renderLogList(screen.querySelector("#log-list"));
      screen.querySelectorAll("[data-filter-company]").forEach(b => b.classList.toggle("active", b.dataset.filterCompany === state.filterCompany));
    });
  });

  screen.querySelector("#admin-back").addEventListener("click", () => {
    state.screen = "person";
    render();
  });

  screen.querySelector("#export-btn").addEventListener("click", exportPDF);

  renderLogList(screen.querySelector("#log-list"));
  app.appendChild(screen);
}

function renderLogList(container) {
  const filtered = state.logs.filter(l => {
    if (state.filterPerson !== "all" && l.personId !== state.filterPerson) return false;
    if (state.filterCompany !== "all" && l.companyId !== state.filterCompany) return false;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">◦</div>No contacts logged yet.<br>Interactions appear here as delegates scan and connect.</div>`;
    return;
  }

  container.innerHTML = "";
  filtered.forEach(log => {
    const person = CONFIG.people[log.personId];
    const company = CONFIG.companies.find(c => c.id === log.companyId);
    const time = new Date(log.ts);
    const timeStr = time.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    const dateStr = time.toLocaleDateString([], {day:"numeric", month:"short"});

    const entry = document.createElement("div");
    entry.className = "log-entry";
    entry.innerHTML = `
      <div class="log-name-row">
        <input class="log-name-input" placeholder="Add name…" value="${log.contactName || ""}" data-log-id="${log.id}" aria-label="Contact name">
        <button class="log-save-btn" data-log-id="${log.id}">Save</button>
        <span class="log-company-badge ${company?.badgeClass||''}">${company?.name||log.companyId}</span>
      </div>
      <div class="log-meta">via ${person?.name.split(" ")[0] || log.personId}</div>
      <div class="log-time">${timeStr}<br><span style="font-size:10px">${dateStr}</span></div>
    `;

    entry.querySelector(".log-save-btn").addEventListener("click", async (e) => {
      const id = e.target.dataset.logId;
      const input = entry.querySelector(`.log-name-input[data-log-id="${id}"]`);
      const name = input.value.trim();
      await updateContactName(id, name);
      log.contactName = name;
      const btn = e.target;
      btn.textContent = "✓";
      btn.style.color = "#7AAE8A";
      setTimeout(() => { btn.textContent = "Save"; btn.style.color = ""; }, 1500);
    });

    entry.querySelector(".log-name-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") entry.querySelector(".log-save-btn").click();
    });

    container.appendChild(entry);
  });
}

// ── PDF EXPORT ─────────────────────────────────────────────
async function exportPDF() {
  const { jsPDF } = window.jspdf;
  if (!jsPDF) { alert("PDF library loading — try again in a moment."); return; }

  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210; const margin = 18;

  // header
  doc.setFillColor(10, 10, 10);
  doc.rect(0, 0, W, 40, "F");
  doc.setTextColor(184, 145, 63);
  doc.setFontSize(8);
  doc.setFont("helvetica", "normal");
  doc.text("CONTACT LOG", margin, 16);
  doc.setTextColor(245, 242, 236);
  doc.setFontSize(18);
  doc.setFont("helvetica", "bold");
  doc.text(CONFIG.event, margin, 28);
  doc.setFontSize(9);
  doc.setFont("helvetica", "normal");
  doc.setTextColor(136, 136, 136);
  doc.text(`Exported ${new Date().toLocaleDateString("en-GB", {day:"numeric",month:"long",year:"numeric"})} · ${state.logs.length} total interactions`, margin, 36);

  let y = 52;

  // group by person
  const grouped = {};
  Object.keys(CONFIG.people).forEach(pid => { grouped[pid] = []; });
  state.logs.forEach(l => { if (grouped[l.personId]) grouped[l.personId].push(l); });

  Object.keys(grouped).forEach(pid => {
    const person = CONFIG.people[pid];
    const logs = grouped[pid];
    if (!logs.length) return;

    if (y > 250) { doc.addPage(); y = 20; }

    // person section header
    doc.setFillColor(26, 26, 26);
    doc.rect(margin - 4, y - 4, W - (margin - 4) * 2, 10, "F");
    doc.setTextColor(184, 145, 63);
    doc.setFontSize(8);
    doc.setFont("helvetica", "bold");
    doc.text(person.name.toUpperCase(), margin, y + 3);
    doc.setTextColor(100, 100, 100);
    doc.text(`${logs.length} contacts`, W - margin, y + 3, {align:"right"});
    y += 14;

    // group by company
    const byCompany = {};
    CONFIG.companies.forEach(c => { byCompany[c.id] = []; });
    logs.forEach(l => { if (byCompany[l.companyId]) byCompany[l.companyId].push(l); });

    CONFIG.companies.forEach(company => {
      const cLogs = byCompany[company.id];
      if (!cLogs.length) return;

      if (y > 260) { doc.addPage(); y = 20; }

      doc.setTextColor(136, 136, 136);
      doc.setFontSize(7);
      doc.setFont("helvetica", "normal");
      doc.text(company.name.toUpperCase(), margin, y);
      y += 5;

      // table header
      doc.setFillColor(20, 20, 20);
      doc.rect(margin - 2, y - 3, W - (margin-2)*2, 7, "F");
      doc.setTextColor(100,100,100);
      doc.setFontSize(7);
      doc.text("Name", margin, y + 1);
      doc.text("Time", W - margin - 20, y + 1);
      y += 8;

      cLogs.forEach(log => {
        if (y > 270) { doc.addPage(); y = 20; }
        const name = log.contactName || "—";
        const t = new Date(log.ts);
        const tStr = t.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) + " " + t.toLocaleDateString([],{day:"numeric",month:"short"});

        doc.setTextColor(220, 220, 220);
        doc.setFontSize(9);
        doc.setFont("helvetica", "normal");
        doc.text(name, margin, y);
        doc.setTextColor(100,100,100);
        doc.setFontSize(8);
        doc.text(tStr, W - margin, y, {align:"right"});

        doc.setDrawColor(30,30,30);
        doc.line(margin - 2, y + 2, W - margin + 2, y + 2);
        y += 8;
      });

      y += 4;
    });

    y += 6;
  });

  // footer
  const pages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setTextColor(50,50,50);
    doc.setFontSize(7);
    doc.text(`${CONFIG.event} · Confidential`, margin, 290);
    doc.text(`${i} / ${pages}`, W - margin, 290, {align:"right"});
  }

  doc.save(`FICCI_Frames_Contacts_${new Date().toISOString().slice(0,10)}.pdf`);
}

// ── INIT ──────────────────────────────────────────────────
async function init() {
  await initDB();

  // check for admin param
  if (window.location.hash === "#admin") {
    state.screen = "admin";
  }

  render();
}

// load jsPDF then init
const jspdfScript = document.createElement("script");
jspdfScript.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
jspdfScript.onload = init;
jspdfScript.onerror = init; // init even if jsPDF fails
document.head.appendChild(jspdfScript);
</script>
